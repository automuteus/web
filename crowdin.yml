# Same Crowdin project as the bot (automuteus/crowdin.yml), so the glossary and translation memory are shared.
# dest keeps the UI's files under /web in the project, apart from the bot's.
files:
  - source: /locales/en/*.json
    dest: /web/%original_file_name%
    translation: /locales/%two_letters_code%/%original_file_name%
    type: i18next_json
